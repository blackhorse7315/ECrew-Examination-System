    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => { });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => console.log('PWA Ready')).catch(err => console.log('PWA Failed', err));
        }

        const manifestCode = {
            "name": "E CREW TWA", "short_name": "EXAM", "start_url": ".", "display": "standalone", "background_color": "#ffffff", "theme_color": "#2563eb", "icons": [{"src": "https://lh3.googleusercontent.com/d/1QMTa94VlTUnqJvrGRV15wBxyNlDGL8y_", "sizes": "512x512", "type": "image/png"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestCode)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = manifestUrl;
        document.head.appendChild(link);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzcfPBaHdmTRLCSrvuT1F-qDsJWUZZQT8",
            authDomain: "twa-ecrew.firebaseapp.com",
            projectId: "twa-ecrew",
            storageBucket: "twa-ecrew.firebasestorage.app",
            messagingSenderId: "559962441630",
            appId: "1:559962441630:web:47087fd2ec7f08156c788f",
            measurementId: "G-MPTFR90EGW"
        };
        
        window.appId = 'e-crew-twa';
        window.app = initializeApp(firebaseConfig);
        window.db = getFirestore(window.app);
        window.auth = getAuth(window.app);
        window.fsDoc = doc; window.fsSetDoc = setDoc; window.fsOnSnapshot = onSnapshot; window.fsRunTransaction = runTransaction;

        async function initFirebase() {
            try {
                await signInAnonymously(window.auth);
                window.firebaseReady = true;
                if(window.loadDataFromCloud) window.loadDataFromCloud(); 
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                const errStr = error.toString();
                let msg = "Gagal koneksi ke server.";
                if(errStr.includes('configuration-not-found')) msg = "Gagal: Anonymous Sign-in BELUM DIAKTIFKAN di Firebase Console Anda!";
                
                document.getElementById('loading-screen').innerHTML = `
                    <div class="text-center p-8 max-w-sm">
                        <div class="text-red-500 text-5xl mb-4">⚠️</div>
                        <h2 class="text-xl font-bold text-slate-800 mb-2">Connection Error</h2>
                        <p class="text-xs text-slate-500 mb-4">${msg}</p>
                        <button onclick="location.reload()" class="px-6 py-2 bg-blue-600 text-white rounded-xl text-xs font-black uppercase">Coba Lagi</button>
                    </div>`;
            }
        }
        initFirebase();
    </script>

    <script>
        // Global Anti-Stuck Failsafe (10 seconds)
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if(!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                document.getElementById('app').classList.remove('opacity-0');
                console.warn("Failsafe: Loading screen removed due to timeout.");
            }
        }, 10000);

        let state = {
            users: [], instructors: [], assignments: [], questionSets: [],
            formNo: { value: 'F/TWA-OPS/061/01', date: '21 Jun 2024' },
            admin: { u: 'admin', p: 'admin119-021' }, superAdmin: { code: '2805' },
            currentUser: null, isAdmin: false, activeTab: 'users',
            lookups: {
                ranks: ['CCP', 'FI', 'GI', 'Capt', 'FO'],
                ratings: ['Gulfstream IV-SP (G-IV)', 'Beechcraft King Air 350 (BE-300)', 'Casa 212 (CA-212)', 'Agusta 109S Grand (AW-109)', 'Bell 412 EP (B412)'],
                categories: ['Type Rating', 'Mandatory Training']
            }
        };

        let unsubscribeSnapshot = null;

        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('app').classList.add('opacity-0'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('app').classList.remove('opacity-0'); }

        // --- FIREBASE SYNC ---
        window.loadDataFromCloud = function() {
            if (!window.firebaseReady || !window.auth.currentUser) return;
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            showLoading();
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            
            const to = setTimeout(() => { hideLoading(); console.warn("Firebase listener timeout"); }, 8000);

            unsubscribeSnapshot = window.fsOnSnapshot(docRef, (docSnap) => {
                clearTimeout(to);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.users = data.users || []; state.instructors = data.instructors || [];
                    state.assignments = data.assignments || []; state.questionSets = data.questionSets || [];
                    if (data.formNo !== undefined) state.formNo = data.formNo;
                    if (data.admin && data.admin.u !== undefined) state.admin = data.admin;
                    if (data.superAdmin && data.superAdmin.code) state.superAdmin.code = data.superAdmin.code;
                } else { syncToCloud(); }
                
                hideLoading();
                if (state.currentUser) {
                    if (state.currentUser.role === 'superadmin') {
                        if (document.getElementById('history-edit-rows')) renderSuperadminHistory();
                        else renderSuperAdmin();
                    }
                    else if (state.isAdmin) renderTabContent(state.activeTab);
                    else if (!window.activeExam) renderUserPortal(); // An active local exam must never be replaced by a remote snapshot.
                }
            }, (error) => {
                clearTimeout(to); hideLoading();
                console.error("Firestore Listen Error:", error);
            });
        };

        function syncToCloud(strict = false) {
            if (!window.firebaseReady || !window.auth.currentUser) { const e = new Error('Firebase belum terhubung.'); return strict ? Promise.reject(e) : Promise.resolve(false); }
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            return window.fsSetDoc(docRef, {
                users: state.users, instructors: state.instructors, assignments: state.assignments,
                questionSets: state.questionSets, formNo: state.formNo, admin: state.admin, superAdmin: state.superAdmin
            }).catch(err => { console.error("Sync Failed:", err); if (strict) throw err; return false; });
        }

        // --- ISOLATED EXAM SESSIONS ---
        // Progress is local to this device/user/assignment, never stored in the shared state.
        function examSessionKey(id) {
            return 'ecrew_exam_v2_' + String(state.currentUser?.id ?? 'unknown') + '_' + String(id);
        }
        function persistExamProgress() {
            const ex = window.activeExam;
            if (!ex || ex.finished) return;
            try {
                localStorage.setItem(examSessionKey(ex.assignment.id), JSON.stringify({
                    currentIndex: ex.currentIndex, answers: ex.answers,
                    questions: ex.questions, deadline: ex.deadline, examTitle: ex.assignment.examTitle,
                    version: 2
                }));
            } catch (err) { console.warn('Cannot save device progress:', err); }
        }
        function clearExamProgress(id) {
            try { localStorage.removeItem(examSessionKey(id)); } catch (err) { console.warn(err); }
        }
        // Update only a single assignment inside a Firestore transaction. Concurrent
        // candidates' COMPLETED/IN PROGRESS writes are merged, not full-state overwrites.
        async function updateOneAssignment(assignmentId, changes) {
            if (!window.firebaseReady || !window.auth.currentUser) throw new Error('Database belum terhubung.');
            const ref = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            return window.fsRunTransaction(window.db, async tx => {
                const snap = await tx.get(ref);
                if (!snap.exists()) throw new Error('Data ujian tidak ditemukan.');
                const list = snap.data().assignments || [];
                const idx = list.findIndex(a => String(a.id) === String(assignmentId));
                if (idx < 0) throw new Error('Assignment tidak ditemukan.');
                if (list[idx].status === 'COMPLETED' && changes.status === 'IN PROGRESS') return;
                list[idx] = { ...list[idx], ...changes };
                tx.update(ref, { assignments: list });
            });
        }

        function handleLogin(e) {
            e.preventDefault();

            if (id === 'superadmin' && pass === state.superAdmin.code) { state.currentUser = { name: 'Super Administrator', role: 'superadmin' }; state.isAdmin = true; loginSuccess(); return; }
            if (id === state.admin.u && pass === state.admin.p) { state.currentUser = { name: 'Administrator', role: 'admin' }; state.isAdmin = true; loginSuccess(); return; }
            
            const inst = state.instructors.find(x => x.username === id && x.password === pass);
            if (inst) { state.currentUser = { ...inst, role: 'instructor' }; state.isAdmin = true; loginSuccess(); return; }

            const u = state.users.find(x => x.username === id && x.password === pass);
            if (u) { state.currentUser = u; state.isAdmin = false; loginSuccess(); return; }
            alert('Username/Email atau Password salah!');
        }

            e.preventDefault();
            const user = document.getElementById('reg-id').value;

        // --- RECORD OF REVISION HELPER ---
        function logRevision(set, action, detail) {
            if (!set.revisions) set.revisions = [];
            const now = new Date(); 
            const timeStr = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            let userStr = 'System';
            if (state.currentUser) {
                if(state.currentUser.role === 'superadmin') userStr = 'Super Admin';
                else if(state.currentUser.role === 'admin') userStr = 'Admin';
                else if(state.currentUser.role === 'instructor') userStr = 'Inst: ' + state.currentUser.name;
                else userStr = state.currentUser.name;
            }
            set.revisions.unshift({ time: timeStr, user: userStr, action: action, detail: detail });
            if (set.revisions.length > 50) set.revisions.pop(); // Keep last 50 logs
        }

        function processBulkImport(setId) {
            const text = document.getElementById('bulk-text').value;
            const defaultSection = document.getElementById('bulk-section').value || 'General';
            const set = state.questionSets.find(s => s.id === setId);
            if(!text.trim()) return alert('Teks kosong.');

            let currentQ = null, addedCount = 0;
            const lines = text.split('\n');
            let activeSectionName = defaultSection;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                let upperLine = line.toUpperCase();

                if (upperLine.startsWith('SECTION') || upperLine.startsWith('BAGIAN')) { activeSectionName = line; continue; }

                if (/^(Q?\d+[\.\)]\s*)/i.test(line)) {
                    if (currentQ) { set.questions.push(currentQ); addedCount++; }
                    currentQ = { id: 0, section: activeSectionName, text: line.replace(/^(Q?\d+[\.\)]\s*)/i, ''), options: {A:'', B:'', C:'', D:''}, answer: 'A' };
                } else if (upperLine.startsWith('A.') || upperLine.startsWith('A)')) { if (currentQ) currentQ.options.A = line.substring(2).trim();
                } else if (upperLine.startsWith('B.') || upperLine.startsWith('B)')) { if (currentQ) currentQ.options.B = line.substring(2).trim();
                } else if (upperLine.startsWith('C.') || upperLine.startsWith('C)')) { if (currentQ) currentQ.options.C = line.substring(2).trim();
                } else if (upperLine.startsWith('D.') || upperLine.startsWith('D)')) { if (currentQ) currentQ.options.D = line.substring(2).trim();
                } else if (upperLine.includes('ANSWER') || upperLine.includes('JAWABAN') || upperLine.startsWith('ANS:')) {
                    if (currentQ) {
                        let match = upperLine.match(/:\s*([A-D])/);
                        if (match && match[1]) currentQ.answer = match[1];
                    }
                } else {
                    if (currentQ && !currentQ.options.A) currentQ.text += ' ' + line;
                }
            }
            if (currentQ) { set.questions.push(currentQ); addedCount++; }
            set.questions.forEach((q, idx) => q.id = idx + 1);
            
            if (addedCount > 0) logRevision(set, 'AUTO PARSE', `Imported ${addedCount} questions.`);
            
            syncToCloud(); closeModal(); viewSetDetails(setId);
            alert(`Berhasil menambahkan ${addedCount} soal baru.`);
        }

                <div class="border-t pt-4"><label class="text-xs font-bold block mb-1">Reason for Answer Correction (mandatory when changing answers)</label><textarea id="he-correction-reason" rows="2" placeholder="Contoh: Koreksi kunci jawaban soal nomor 8 berdasarkan review examiner tanggal ..." class="w-full p-3 border rounded-xl text-sm"></textarea><p class="text-[10px] text-slate-500 mt-1">Koreksi harus berdasarkan bukti, bukan untuk mengejar target nilai. Alasan tersimpan dalam revision audit log.</p></div>
                ${Array.isArray(a.historyRevisions) && a.historyRevisions.length ? `<div class="border-t pt-3"><h4 class="text-xs font-black mb-2">Revision Audit Log</h4>${a.historyRevisions.slice().reverse().slice(0,10).map(r => `<p class="text-[10px] text-slate-500 py-1">${escapeHistoryHTML(r.at)} — ${escapeHistoryHTML(r.by)}: ${escapeHistoryHTML(r.detail)}</p>`).join('')}</div>` : ''}

        function updateHistoryTargetPreview() {
            const output = document.getElementById('he-target-preview');
            const input = document.getElementById('he-target-score');
            if (!output || !input) return;
            const answers = [...document.querySelectorAll('.history-edit-answer')];
            const n = answers.length;
            if (!n) { output.textContent = 'Question bank tidak tersedia. Kalkulasi target score tidak dapat dilakukan.'; return; }
            const target = Number(input.value);
            if (!Number.isFinite(target) || target < 0 || target > 100 || !Number.isInteger(target)) {
                output.textContent = 'Masukkan target nilai bulat antara 0–100.'; return;
            }
            const a = state.assignments.find(x => String(x.id) === String(window.historyEditActiveAssignmentId) && x.status === 'COMPLETED');
            const questions = a ? getHistoryQuestions(a) : [];
            const selected = Object.fromEntries(answers.map(el => [String(el.dataset.questionId), el.value]));
            const correct = questions.filter(q => selected[String(q.id)] === q.answer).length;
            const currentScore = Math.round(correct * 100 / n);
            const candidates = Array.from({length:n+1}, (_,k) => ({k,score:Math.round(k*100/n)})).filter(x => x.score === target);
            if (!candidates.length) {
                const closest = Array.from({length:n+1},(_,k) => ({k,score:Math.round(k*100/n)})).sort((a,b) => Math.abs(a.score-target)-Math.abs(b.score-target))[0];
                output.textContent = `Saat ini ${correct}/${n} benar (${currentScore}%). Target ${target}% tidak dapat dicapai persis dengan ${n} soal berbobot sama. Nilai terdekat ${closest.score}% (${closest.k}/${n} benar). Tidak ada jawaban yang diubah otomatis.`;
            } else {
                const desired = candidates[0].k;
                const gap = desired-correct;
                output.textContent = `Saat ini ${correct}/${n} benar (${currentScore}%). Target ${target}% memerlukan ${desired}/${n} jawaban benar (${gap > 0 ? gap+' lebih banyak' : gap < 0 ? Math.abs(gap)+' lebih sedikit' : 'sudah sesuai'}). Perubahan hanya boleh berdasarkan koreksi yang terverifikasi.`;
            }
        }
        async function saveSuperadminHistoryEdit(assignmentId) {
            if (!requireHistorySuperadmin()) return;
            const a = state.assignments.find(x => String(x.id) === String(assignmentId) && x.status === 'COMPLETED');
            if (!a) return alert('History tidak ditemukan.');
            const date = document.getElementById('he-date').value;
            const time = document.getElementById('he-time').value;
            const hours = Number(document.getElementById('he-hours').value);
            const mins = Number(document.getElementById('he-minutes').value);
            const instId = document.getElementById('he-inst').value;
            const chosen = state.instructors.find(i => String(i.id) === instId);
            const instructor = chosen ? `${chosen.name} (${chosen.loaNo})` : document.getElementById('he-inst-custom').value.trim();
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !time || !/^\d{2}:\d{2}$/.test(time) || !instructor) return alert('Isi tanggal, jam dan Instructor/Examiner dengan benar.');
            if (!Number.isInteger(hours) || !Number.isInteger(mins) || hours < 0 || hours > 100 || mins < 0 || mins > 59 || hours * 60 + mins <= 0) return alert('Durasi harus lebih dari 0 dan menit 0–59.');
            const qs = getHistoryQuestions(a);
            const nextAnswers = { ...(a.answers || {}) };
            document.querySelectorAll('.history-edit-answer').forEach(select => {
                if (select.value) nextAnswers[select.dataset.questionId] = select.value;
                else delete nextAnswers[select.dataset.questionId];
            });
            const correct = qs.filter(q => nextAnswers[q.id] === q.answer).length;
            const nextScore = qs.length ? Math.round(correct * 100 / qs.length) : a.score;
            const nextGrade = qs.length ? getHistoryGrade(nextScore) : a.grade;
            const old = { instructor: a.instructor, examDate: a.examDate, examTime: a.examTime, duration: a.duration, score: a.score, answers: a.answers || {} };
            const details = [];
            if (old.instructor !== instructor) details.push('examiner');
            if (old.examDate !== date) details.push('date');
            if (old.examTime !== time) details.push('time');
            if (old.duration !== `${hours}h ${mins}m`) details.push('duration');
            const answersChanged = JSON.stringify(old.answers) !== JSON.stringify(nextAnswers);
            const correctionReason = (document.getElementById('he-correction-reason')?.value || '').trim();
            if (answersChanged && correctionReason.length < 15) return alert('Untuk mengubah jawaban, isi alasan koreksi berbasis bukti (minimal 15 karakter).');
            if (answersChanged) details.push('answers corrected: ' + correctionReason);
            if (old.score !== nextScore) details.push(`score ${old.score}% → ${nextScore}%`);
            if (!details.length) return alert('Tidak ada perubahan data.');
            if (!confirm('Simpan perubahan History ujian ini? Koreksi akan tampil pada Admin dan User.')) return;
            const btn = document.getElementById('he-save'); btn.disabled = true; btn.textContent = 'Saving...';
            const previous = structuredClone(a);
            a.instructor = instructor; a.instructorId = chosen ? chosen.id : null;
            a.instructorSignUrl = chosen ? chosen.signUrl || '' : '';
            a.examDate = date; a.examTime = time; a.duration = `${hours}h ${mins}m`;
            if (qs.length) { a.answers = nextAnswers; a.score = nextScore; a.grade = nextGrade; }
            if (!Array.isArray(a.historyRevisions)) a.historyRevisions = [];
            a.historyRevisions.push({ at: new Date().toISOString(), by: 'Superadmin', detail: details.join(', '), before: old, after: { instructor, date, time, duration: a.duration, score: a.score, answers: a.answers || {} } });
            try {
                // Persist in the shared Firestore document; onSnapshot refreshes Admin/User live.
                await syncToCloud(true);
                closeModal(); renderSuperadminHistory();
                alert('History berhasil diperbarui dan disinkronkan ke Firebase.');
            } catch (error) {
                Object.keys(a).forEach(k => delete a[k]); Object.assign(a, previous);
                btn.disabled = false; btn.textContent = 'Save Changes';
                alert('Gagal menyimpan History ke Firebase: ' + (error.message || error));
            }
        }

        function renderHistoryData() {
            const completed = state.assignments.filter(a => a.status === 'COMPLETED').sort((a,b) => new Date(b.examDate) - new Date(a.examDate));
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <div><h2 class="text-xl font-bold">Exam History</h2></div>
                    <button onclick="openImportHistoryModal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold uppercase shadow-lg shadow-indigo-100 tracking-widest hover:bg-indigo-700 transition-all">Import History</button>

        function printExamResult(assignmentId) {
            const a = state.assignments.find(x => x.id === assignmentId);
            if (!a) return;
            const u = state.users.find(x => x.id === a.userId);
            if (!u) return;

            const tL = a.examTitle.toLowerCase(), term = (tL.includes('initial') || tL.includes('upgrade')) ? 'Trainee' : 'Candidate';
            // Instructor disimpan sebagai "Nama (LOA)". Utamakan ID jika tersedia,
            // lalu cocokkan LOA/nama secara toleran terhadap spasi dan kapitalisasi.
            const assignedInstructor = String(a.instructor || '').trim();
            const normalizeText = value => String(value || '').normalize('NFKC').replace(/\s+/g, ' ').trim().toLowerCase();
            const instructorMatch = assignedInstructor.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
            const requestedName = instructorMatch ? instructorMatch[1].trim() : assignedInstructor;
            const requestedLOA = instructorMatch ? instructorMatch[2].trim() : '';
            const instObj = state.instructors.find(x => a.instructorId != null && String(x.id) === String(a.instructorId))
                || state.instructors.find(x => normalizeText(x.name) === normalizeText(requestedName) && (!requestedLOA || normalizeText(x.loaNo) === normalizeText(requestedLOA)))
                || state.instructors.find(x => normalizeText(x.name) === normalizeText(requestedName))
                || state.instructors.find(x => requestedLOA && normalizeText(x.loaNo) === normalizeText(requestedLOA));
            const instName = instObj ? instObj.name : requestedName;
            const instLOA = instObj ? (instObj.loaNo || requestedLOA || '-') : (requestedLOA || '-');
            const instSignUrl = instObj ? instObj.signUrl : (a.instructorSignUrl || '');
            const set = state.questionSets.find(q => q.title === a.examTitle), historicalQuestions = getHistoryQuestions(a), qs = historicalQuestions.length ? historicalQuestions : Array(10).fill({id: 0, text: '...', options: {A: 'A', B: 'B', C: 'C', D: 'D'}, answer: 'C'});
            
            const total = qs.length, correct = Math.round((a.score / 100) * total);
            let ansH = '';
            for(let i=0; i<total; i++) {
                const q = qs[i], ua = a.answers ? a.answers[q.id] : null;
                if(ua === q.answer) { ansH += `<div class="print-summary-item correct"><b>Q${i+1}: ${q.text}</b><br>${q.answer}. ${q.options[q.answer]} ✓</div>`; } 
                else { ansH += `<div class="print-summary-item wrong"><b>Q${i+1}: ${q.text}</b><br>${ua ? ua+'. '+q.options[ua] : 'No Answer'} ✗ (Correct: ${q.answer}. ${q.options[q.answer]})</div>`; }
            }

            const cyc = (tL.includes('recurrent') && set && set.cycle && set.cycle !== 'None') ? set.cycle : null;

            // Menerima URL biasa, data URI, kode <img>, dan Google Drive sharing URL.
            // Hanya hasilkan <img> agar browser print tidak mengabaikan HTML embed lain.
            const formatSignature = signData => {
                let raw = String(signData || '').trim();
                if (!raw) return '';
                const tagMatch = raw.match(/<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/i)
                    || raw.match(/<img\b[^>]*\bsrc\s*=\s*([^\s>]+)/i);
                if (tagMatch) raw = tagMatch[1];
                raw = raw.replace(/&amp;/g, '&').trim();
                const driveId = raw.match(/drive\.google\.com\/file\/d\/([\w-]+)/i)
                    || raw.match(/drive\.google\.com\/open\?id=([\w-]+)/i)
                    || raw.match(/[?&]id=([\w-]+)/i);
                if (driveId) raw = 'https://lh3.googleusercontent.com/d/' + driveId[1];
                if (!/^https?:\/\//i.test(raw) && !/^data:image\/(png|jpeg|jpg|gif|webp);base64,/i.test(raw)) return '';
                const safeSrc = raw.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
                return `<img src="${safeSrc}" alt="Signature" loading="eager" referrerpolicy="no-referrer" />`;
            };

            const userSignatureHTML = formatSignature(u.signUrl);
            const instSignatureHTML = formatSignature(instSignUrl);

            document.getElementById('print-area').innerHTML = `
                <div class="print-page">
                    <div class="print-header">
                        <img src="https://lh3.googleusercontent.com/d/1WNcGjsZ9_Fp54xzOl01EYRqM6-wY5Zh7" alt="TWA Logo" style="display: block; margin: 0 auto 15px auto; height: 70px; object-fit: contain;" crossorigin="anonymous" />
                        <h1>Transwisata Prima Aviation</h1><h2>FLIGHT CREW EXAMINATION RESULT</h2><h3>${a.examTitle}</h3>${cyc ? `<h4 style="margin: 5px 0 0 0; font-size: 12pt;">(${cyc.toUpperCase()})</h4>` : ''}
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; font-size: 10pt; margin-top: 15px;"><div style="text-align: left; font-weight: bold; font-style: italic;">Online Examination Form</div><div style="text-align: right;">Form No: ${state.formNo ? state.formNo.value : '-'}</div></div>
                    </div>
                    <div class="print-section-title">${term.toUpperCase()} INFORMATION</div>
                    <table class="print-table"><tr><td>Name ${term}:</td><td><b>${u.name}</b></td></tr><tr><td>Rank:</td><td><b>${u.rank}</b></td></tr><tr><td>No. License:</td><td><b>${u.license || '-'}</b></td></tr>${cyc ? `<tr><td>Training Cycle:</td><td><b>${cyc}</b></td></tr>` : ''}<tr><td>Name Instructor:</td><td><b>${instName}</b></td></tr><tr><td>LOA Instructor:</td><td><b>${instLOA}</b></td></tr><tr><td>Exam Date:</td><td><b>${formatDisplayDate(a.examDate)}</b></td></tr><tr><td>Exam Time:</td><td><b>${a.examTime || '-'}</b></td></tr><tr><td>Duration:</td><td><b>${a.duration || '-'}</b></td></tr></table>
                    <div class="print-section-title" style="text-align: center;">EXAMINATION RESULT</div>
                    <div class="print-result-box"><div class="print-score" style="color: ${a.score < 75 ? 'red' : 'green'};">${a.score}%</div><div style="font-weight: bold; margin-bottom: 5px;">${a.grade} - ${correct} out of ${total} correct</div><div>Passing Score: 75% | Result: ${a.score >= 75 ? '✓ PASS' : '✗ FAIL'}</div>${tL.includes('recurrent') ? `<div style="font-weight: bold; margin-top: 10px; color: green;">CORRECTED TO 100%</div>` : ''}</div>
                    <div class="print-section-title">ANSWER SUMMARY</div><div>${ansH}</div>
                    <div class="print-signatures"><div class="print-sig-box"><div class="print-sig-title">${term} Signature</div><div class="print-sig-img">${userSignatureHTML}</div><div class="print-sig-name">${u.name}</div><div class="print-sig-detail">${u.license || '-'}</div></div><div class="print-sig-box"><div class="print-sig-title">Examiner Signature</div><div class="print-sig-img">${instSignatureHTML}</div><div class="print-sig-name">${instName}</div><div class="print-sig-detail">${instLOA || '-'}</div></div></div>
                </div>`;
            
            // Tunggu gambar selesai dimuat dan selesai didekode sebelum membuka print.
            // Jangan kosongkan print-area sesaat setelah window.print(), karena di
            // Safari/iPhone dialog Save as PDF dapat masih membaca DOM yang sama.
            const printArea = document.getElementById('print-area');
            const images = Array.from(printArea.querySelectorAll('img'));
            const imageReady = img => new Promise(resolve => {
                if (img.complete) return resolve(img.naturalWidth > 0);
                let settled = false;
                const finish = ok => {
                    if (settled) return;
                    settled = true;
                    img.removeEventListener('load', success);
                    img.removeEventListener('error', failure);
                    resolve(ok);
                };
                const success = () => finish(img.naturalWidth > 0);
                const failure = () => finish(false);
                img.addEventListener('load', success, { once: true });
                img.addEventListener('error', failure, { once: true });
                if (img.complete) finish(img.naturalWidth > 0);
            });
            const withTimeout = (promise, ms) => Promise.race([
                promise,
                new Promise(resolve => setTimeout(() => resolve(false), ms))
            ]);
            Promise.all(images.map(img => withTimeout(imageReady(img), 12000))).then(async results => {
                for (let index = 0; index < images.length; index++) {
                    if (results[index] && images[index].decode) {
                        try { await withTimeout(images[index].decode().then(() => true).catch(() => false), 2000); }
                        catch (error) { /* Decoding failed; still allow printing. */ }
                    }
                }
                const instructorImage = printArea.querySelector('.print-sig-box:last-child .print-sig-img img');
                if (!instSignatureHTML) {
                    console.warn('Instructor signature is empty or instructor data did not match:', assignedInstructor);
                } else if (instructorImage && !instructorImage.naturalWidth) {
                    console.warn('Instructor signature image could not be loaded. Check the image URL and public access permissions.');
                    alert('Gambar tanda tangan Instructor/Examiner gagal dimuat. Periksa Signature Code dan izin akses gambar pada menu Instructor. PDF tetap dapat dicetak.');
                }
                // Judul dokumen digunakan browser sebagai saran nama file Save as PDF.
                // Data diambil langsung dari record ujian sehingga edit History terbaru ikut terpakai.
                const safeFilePart = value => String(value || '')
                    .normalize('NFKC')
                    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ')
                    .replace(/\s+/g, ' ').trim()
                    .replace(/[. ]+$/g, '') || 'Unknown';
                const dateParts = String(a.examDate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
                const pdfDate = dateParts
                    ? `${dateParts[3]}-${dateParts[2]}-${dateParts[1]}`
                    : safeFilePart(a.examDate || 'No-Date');
                const pdfFilename = [safeFilePart(a.userName || u.name), safeFilePart(a.examTitle), pdfDate].join(' - ');
                const previousDocumentTitle = document.title;
                document.title = pdfFilename;
                // afterprint berlaku di browser desktop; fallback agar judul tab tidak menetap.
                let restoredTitle = false;
                const restorePrintTitle = () => {
                    if (restoredTitle) return;
                    restoredTitle = true;
                    document.title = previousDocumentTitle;
                    window.removeEventListener('afterprint', restorePrintTitle);
                };
                window.addEventListener('afterprint', restorePrintTitle);
                // Satu kesempatan untuk layout akhir sebelum browser membuat PDF.
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                try { window.print(); }
                catch (error) { restorePrintTitle(); throw error; }
                // Di sejumlah browser mobile, afterprint tidak dikirimkan.
                // Jangan restore terlalu cepat karena Safari/iOS dapat menunda dialog cetak.
                setTimeout(restorePrintTitle, 120000);
            });

        // --- USER PORTAL ---
        function renderUserPortal() {
            // Explicitly leaving the completed result releases the page for live updates.
            if (window.activeExam?.finished) window.activeExam = null;
            if (window.activeExam) return;
            let html = `<div class="mb-8 page-fade"><h2 class="text-3xl font-black text-slate-800 tracking-tight">Welcome, ${state.currentUser.name}</h2></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 page-fade">`;

        function startRealExam(assignmentId) {
            if (window.activeExam && !window.activeExam.finished) {
                if (String(window.activeExam.assignment.id) === String(assignmentId)) { renderActiveExamUI(); return; }
                alert('Selesaikan ujian yang sedang berjalan terlebih dahulu.'); return;
            }
            const a = state.assignments.find(x => String(x.id) === String(assignmentId));
            const set = a && state.questionSets.find(q => q.title === a.examTitle);
            if (!a || !set || !set.questions || !set.questions.length) return alert('Exam questions not found.');
            if (a.status === 'COMPLETED') return alert('Ujian ini sudah selesai.');
            const now = new Date(), parts = (a.examDate || '').split('-');
            let durMins = 60;
            if (a.duration) {
                const hm = a.duration.match(/(\d+)h/), mm = a.duration.match(/(\d+)m/);
                durMins = ((hm ? parseInt(hm[1]) : 0) * 60) + (mm ? parseInt(mm[1]) : 0) || 60;
            }
            let deadline = Date.now() + durMins * 60000;
            if (parts.length === 3) {
                const eDate = new Date(+parts[0], +parts[1] - 1, +parts[2]); eDate.setHours(0,0,0,0);
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                if (today < eDate) return alert('Belum waktunya ujian.');
                if (+today === +eDate && a.examTime) {
                    const tm = a.examTime.split(':');
                    if (tm.length === 2) {
                        const opening = new Date(eDate); opening.setHours(+tm[0], +tm[1], 0, 0);
                        if (Date.now() < +opening) return alert('Belum waktunya ujian.');
                        deadline = +opening + durMins * 60000;
                    }
                }
            }
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(examSessionKey(a.id)) || 'null'); } catch (err) { console.warn(err); }
            let questions;
            if (saved && saved.version === 2 && saved.examTitle === a.examTitle &&
                Array.isArray(saved.questions) && saved.questions.length === set.questions.length) {
                questions = saved.questions;
                deadline = Math.min(deadline, Number(saved.deadline) || deadline);
            } else {
                questions = [...set.questions];
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                saved = null;
            }
            window.activeExam = {
                assignment: a, set, questions,
                currentIndex: saved ? Math.max(0, Math.min(questions.length - 1, Number(saved.currentIndex) || 0)) : 0,
                answers: saved?.answers || {}, deadline,
                timeLeft: Math.max(0, Math.ceil((deadline - Date.now()) / 1000)), timerId: null,
                finished: false
            };
            persistExamProgress();
            // No full-document sync: only this pilot's status may change.
            if (a.status !== 'IN PROGRESS') {
                updateOneAssignment(a.id, { status: 'IN PROGRESS' })
                    .catch(err => console.warn('Status sync deferred:', err));
            }
            const ex = window.activeExam;
            ex.timerId = setInterval(() => {
                if (window.activeExam !== ex || ex.finished) { clearInterval(ex.timerId); return; }
                ex.timeLeft = Math.max(0, Math.ceil((ex.deadline - Date.now()) / 1000));
                if (!ex.timeLeft) {
                    clearInterval(ex.timerId);
                    renderActiveExamUI();
                    alert('Waktu habis. Silakan kumpulkan jawaban.');
                } else updateTimerUI();
            }, 1000);
            renderActiveExamUI();
        }

        function updateTimerUI() { const el = document.getElementById('exam-timer-display'); if (el && window.activeExam) { const m = Math.floor(window.activeExam.timeLeft / 60).toString().padStart(2, '0'), s = (window.activeExam.timeLeft % 60).toString().padStart(2, '0'); el.innerText = `${m}:${s}`; } }

        function renderActiveExamUI() {
            const ex = window.activeExam, q = ex.questions[ex.currentIndex], isLast = ex.currentIndex === ex.questions.length - 1, isFirst = ex.currentIndex === 0, timeUp = ex.timeLeft <= 0; 
            let html = `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden page-fade">
                    <div class="bg-blue-600 p-6 text-white flex justify-between items-center"><div><h3 class="font-black text-lg tracking-wider uppercase">${ex.set.title}</h3><p class="text-xs text-blue-200 mt-1 uppercase tracking-widest">Question ${ex.currentIndex + 1} of ${ex.questions.length}</p></div><div class="bg-blue-800/50 px-4 py-2 rounded-xl border border-blue-500 text-center"><span class="text-[10px] uppercase font-bold text-blue-200 block mb-1">Time Remaining</span><span id="exam-timer-display" class="font-mono font-bold text-2xl ${timeUp ? 'text-red-400' : ''}">--:--</span></div></div>
                    <div class="p-8 md:p-12"><span class="text-[10px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded uppercase tracking-widest">${q.section}</span><h4 class="text-xl font-bold text-slate-800 mt-6 mb-8 leading-relaxed">${ex.currentIndex + 1}. ${q.text}</h4>
                        <div class="space-y-4">${['A', 'B', 'C', 'D'].map(opt => { const optText = q.options[opt]; if (!optText) return ''; const isSel = ex.answers[q.id] === opt, cStyle = timeUp ? 'cursor-not-allowed opacity-70' : 'cursor-pointer hover:border-blue-300'; return `<div ${timeUp ? '' : `onclick="selectExamOption('${opt}')"`} class="p-5 border-2 rounded-2xl transition-all ${isSel ? 'border-blue-600 bg-blue-50 shadow-md' : `border-slate-100 bg-white ${cStyle}`}"><div class="flex items-center gap-4"><div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${isSel ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${opt}</div><span class="font-medium text-slate-700 text-base">${optText}</span></div></div>`; }).join('')}</div>
                    </div>
                    <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center"><button onclick="navigateExam(-1)" class="px-8 py-3 text-sm font-bold text-slate-500 uppercase ${isFirst ? 'invisible' : ''} hover:bg-slate-200 rounded-xl transition-colors">Previous</button>${(isLast || timeUp) ? `<button onclick="submitExam(${timeUp ? 'true' : 'false'})" class="px-10 py-3 ${timeUp ? 'bg-red-600 animate-pulse' : 'bg-green-600 hover:bg-green-700'} text-white rounded-xl text-sm font-black uppercase shadow-lg">Submit</button>` : `<button onclick="navigateExam(1)" class="px-10 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-black uppercase shadow-lg">Next</button>`}</div>
                </div>`;
            document.getElementById('dynamic-content').innerHTML = html; updateTimerUI(); 
        }

        function selectExamOption(opt) {
            const ex = window.activeExam;
            if (!ex || ex.finished || ex.timeLeft <= 0) return;
            ex.answers[ex.questions[ex.currentIndex].id] = opt;
            persistExamProgress(); renderActiveExamUI();
            const current = ex.currentIndex;
            if (current < ex.questions.length - 1) setTimeout(() => {
                if (window.activeExam === ex && !ex.finished && ex.currentIndex === current) navigateExam(1);
            }, 300);
        }
        function navigateExam(dir) {
            const ex = window.activeExam;
            if (!ex || ex.finished) return;
            ex.currentIndex = Math.max(0, Math.min(ex.questions.length - 1, ex.currentIndex + dir));
            persistExamProgress(); renderActiveExamUI();
        }
        async function submitExam(force = false) {
            const ex = window.activeExam;
            if (!ex || ex.finished || ex.submitting) return;
            if (force !== true && !confirm('Kumpulkan jawaban sekarang?')) return;
            ex.submitting = true;
            clearInterval(ex.timerId);
            let cc = 0;
            ex.questions.forEach(q => { if (ex.answers[q.id] === q.answer) cc++; });
            const score = Math.round(cc / ex.questions.length * 100);
            const grade = score === 100 ? 'PERFECT' : score >= 86 ? 'EXCELLENT' : score >= 75 ? 'PASSED' : 'FAILED';
            const changes = {
                status: 'COMPLETED', score, grade, answers: { ...ex.answers },
                questionSnapshot: ex.questions.map(q => ({ id: q.id, section: q.section, text: q.text,
                    options: { ...q.options }, answer: q.answer }))
            };
            try {
                await updateOneAssignment(ex.assignment.id, changes);
                Object.assign(ex.assignment, changes);
                ex.finished = true;
                clearExamProgress(ex.assignment.id);
                renderExamResultUserView(ex, score, grade, cc);
            } catch (err) {
                ex.submitting = false;
                ex.timeLeft = Math.max(0, Math.ceil((ex.deadline - Date.now()) / 1000));
                persistExamProgress();
                renderActiveExamUI();
                alert('Hasil belum berhasil disimpan ke database. Jawaban masih tersimpan pada perangkat ini. Periksa koneksi lalu tekan Submit kembali. ' + err.message);
                if (ex.timeLeft > 0) ex.timerId = setInterval(() => {
                    ex.timeLeft = Math.max(0, Math.ceil((ex.deadline - Date.now()) / 1000));
                    if (ex.timeLeft === 0) { clearInterval(ex.timerId); renderActiveExamUI(); }
                    else updateTimerUI();
                }, 1000);
            }
        }

        function renderExamResultUserView(ex, score, grade, cc) {
            const isRec = ex.assignment.examTitle.toLowerCase().includes('recurrent'); let sCl = score === 100 ? "text-gold" : score >= 75 ? "text-green-500" : "text-red-500"; let ansH = '';
            ex.questions.forEach((q, idx) => {
                const ua = ex.answers[q.id];
                if(ua === q.answer) { ansH += `<div class="mb-3 p-5 bg-green-50 border border-green-100 rounded-xl"><p class="font-bold text-sm text-slate-800 mb-2">Q${idx + 1}: ${q.text}</p><p class="text-xs font-bold text-green-600">${q.answer}. ${q.options[q.answer]} ✓</p></div>`; } 
                else { ansH += `<div class="mb-3 p-5 bg-red-50 border border-red-100 rounded-xl"><p class="font-bold text-sm text-slate-800 mb-2">Q${idx + 1}: ${q.text}</p><p class="text-xs font-bold text-red-500 mb-2">${ua ? ua + '. ' + q.options[ua] : 'No Answer'} ✗</p><p class="text-[10px] font-bold text-green-600">Correct: ${q.answer}. ${q.options[q.answer]}</p></div>`; }
            });
            document.getElementById('dynamic-content').innerHTML = `<div class="max-w-3xl mx-auto space-y-6 page-fade"><div class="bg-dark-card p-8 rounded-3xl text-center border border-slate-700 relative overflow-hidden"><h2 class="text-white text-sm font-black uppercase mb-4 relative z-10">EXAMINATION COMPLETED</h2><div class="text-7xl font-black ${sCl} mb-4 relative z-10">${score}%</div><div class="inline-block px-4 py-1 rounded-full ${score >= 75 ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} font-bold text-sm uppercase mb-2 relative z-10">${grade}</div><p class="text-slate-400 text-xs font-medium relative z-10">${cc} correct out of ${ex.questions.length}</p>${isRec ? `<p class="mt-4 text-green-400 font-bold text-xs uppercase relative z-10 border border-green-500/30 inline-block px-3 py-1 rounded bg-green-500/10">CORRECTED TO 100%</p>` : ''}</div><div class="bg-white rounded-3xl p-8"><h3 class="text-lg font-black text-slate-800 uppercase mb-6 border-b border-slate-100 pb-4">Detailed Review</h3><div class="space-y-2">${ansH}</div></div><div class="text-center pt-4"><button onclick="renderUserPortal()" class="px-10 py-4 bg-slate-900 hover:bg-slate-800 transition-colors text-white rounded-xl text-sm font-black uppercase shadow-xl">Back to Dashboard</button></div></div>`;
        }

        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function updateSignPreview(val, boxId) { document.getElementById(boxId).innerHTML = val || '<span class="text-[10px] text-slate-400 italic">No signature yet</span>'; }

        // --- PWA LOGIC FALLBACK ---
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            const btn1 = document.getElementById('btn-install-login'); if(btn1) btn1.classList.add('hidden');
            const btn2 = document.getElementById('btn-install-main'); if(btn2) btn2.classList.add('hidden');
        } else {
            let pwaPrompt;
            window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pwaPrompt = e; });
            window.installPWA = function() {
                if (pwaPrompt) {
                    pwaPrompt.prompt(); pwaPrompt.userChoice.then(() => { pwaPrompt = null; });
                } else {
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                    if(isIOS) alert("CARA INSTALL DI iOS/iPHONE:\n1. Tekan tombol Share (kotak dengan panah ke atas) di menu bawah Safari.\n2. Scroll ke bawah, pilih 'Add to Home Screen'.");
                    else alert("CARA INSTALL DI ANDROID/PC:\n1. Buka menu browser (titik tiga di pojok kanan atas).\n2. Pilih 'Add to Home screen' atau 'Install app'.");
                }
            };
        }
    </script>
</body>
</html>
